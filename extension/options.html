<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>블로그 글쓰기 도우미 설정</title>
  <style>
    body { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 20px; color: #02a64b; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input { width: 100%; padding: 8px 10px; font: inherit; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 9px 16px; font: inherit; border: 0; border-radius: 6px; background: #03c75a; color: #fff; font-weight: 600; cursor: pointer; }
    .hint { color: #777; font-size: 13px; }
    #status { margin-top: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>네이버 블로그 글쓰기 도우미</h1>
  <p class="hint">사내 글쓰기 도우미 서버 주소를 등록하면, 그 화면의 "네이버 에디터로 보내기" 버튼과 이 확장이 연결되고
    발행 예정 시각이 된 글을 1분마다 확인해 알림을 띄웁니다.
    내 PC에서 기본 포트로 띄운 서버(http://localhost:8000)는 등록하지 않아도 됩니다.</p>
  <label for="origin">도우미 서버 주소</label>
  <input id="origin" placeholder="예: http://192.168.0.10:8000">
  <button id="save">저장</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
